# Factor definitions. Every factor score is oriented so HIGHER = more attractive.
# direction: how the raw metric maps to attractiveness.
# missing: how missing/invalid values are handled (sector median imputation).
# Sleeve weights set 2026-09-28 from the factor-efficacy lab + correlation/PCA
# (reports/factor_efficacy_20260928.md, reports/factor_correlation_pca_20260928.md).
# Revised 2026-09-29: PEG removed from value (no vendor data), growth set to
# zero weight (falsified belief, kept for transparency), low-vol trimmed per
# the lab's down-weight verdict; then the build-out batch: quality 3->7 metrics,
# real 12-1 momentum, value +EV/EBITDA+P/B. Metric-level recommendations
# (size orientation) target the Intrinio panel pipeline; see the reports.
# 2026-09-30: zero-weight taxonomy -- diagnostics (quality, size: scored every
# run, each with a written reinstatement rule), falsified belief (growth:
# scored every run for transparency, no reinstatement path), negative control
# (noise: seeded Gaussian, null by construction, validates the lab machinery).
factors:
  value:
    weight: 0.20
    description: "Cheap on earnings yield, sales, EV/EBITDA and book (2026-09-30: P/E replaced by earnings yield = 1/P/E -- same economic information, but P/E explodes near zero earnings and poisons the z-score pipeline; pe_ratio stays in the frame as a diagnostic. PEG removed 2026-09-29: no vendor data)"
    metrics:
      earn_yield:   {direction: higher_better, missing: sector_median}
      ps_ratio:     {direction: lower_better, missing: sector_median}
      ev_to_ebitda: {direction: lower_better, missing: sector_median}
      pb_ratio:     {direction: lower_better, missing: sector_median}
  quality:
    weight: 0.00
    description: "ZERO-WEIGHT DIAGNOSTIC since 2026-09-30: exact 8-metric sleeve validates on the broad panel (21d IC +0.039, t=5.2) but is dead on large caps (IC~0, all 8 metrics t<1.3). Scored every run. REINSTATEMENT: returns when its large-cap trailing-12m IC turns positive with t > 2; review at least annually; never on a single window"
    metrics:
      roe:               {direction: higher_better, missing: sector_median}
      roa:               {direction: higher_better, missing: sector_median}
      gross_margin:      {direction: higher_better, missing: sector_median}
      profit_margin:     {direction: higher_better, missing: sector_median}
      fcf_margin:        {direction: higher_better, missing: sector_median}
      debt_to_equity:    {direction: lower_better,  missing: sector_median}
      debt_to_ebitda:    {direction: lower_better,  missing: sector_median}
      interest_coverage: {direction: higher_better, missing: sector_median}
  size:
    weight: 0.00
    description: "ZERO-WEIGHT since 2026-09-30: failed natively on large caps (-1.4%/yr; the broad +11.2%/yr was 'avoid microcap junk'). Scored every run. REINSTATEMENT (flip-back rule): if the trailing-12m size IC turns positive with the academic orientation, flip back to smaller-is-better; revisit at least annually"
    metrics:
      enterprise_value: {direction: higher_better, missing: sector_median}
  growth:
    weight: 0.00
    description: "FALSIFIED BELIEF (since 2026-09-30): growth is widely believed to drive equity returns -- that is why its failure stays visible. Tested and rejected: rev_growth IC -0.0017, ebitda_growth t +0.90, ebit_growth t +1.59 (none near significance across all three TTM definitions). Scored every run for transparency so the lab's failures stay on display. NOT a candidate and NOT a negative control: no reinstatement rule; re-promotion would require a new documented research decision. (Seeded noise is the true negative control.)"
    metrics:
      rev_growth:    {direction: higher_better, missing: sector_median}
      ebit_growth:   {direction: higher_better, missing: sector_median}
      ebitda_growth: {direction: higher_better, missing: sector_median}
  noise:
    weight: 0.00
    description: "NEGATIVE CONTROL (since 2026-09-30): seeded Gaussian noise, null by construction (factors/noise.py -- seed derived from date string plus fixed salt, deterministic per date, independent draw per ticker). Its IC should hover near zero on every run. If it ever clears |t| > 2, distrust the lab machinery, not the market. Scored every run; never enters the composite."
  momentum:
    weight: 0.20
    description: "12-1 trailing return on the live path (52-week-low proxy on the workbook path, which has no price history)"
    metrics:
      mom_12_1: {direction: higher_better, missing: sector_median}
  lowvol:
    weight: 0.10
    description: "126-day realized volatility, lower = better (reverted 2026-09-30: the 252d-beta definition was rejected on both universes, worst exactly when low-vol should protect; trailing_beta stays in the frame as a diagnostic)"
    metrics:
      vol_126d: {direction: lower_better, missing: sector_median}

scoring:
  winsorize_sigma: 3.0
  neutralize_by: sector
  rank_method: min   # rank 1 = most attractive within sector
