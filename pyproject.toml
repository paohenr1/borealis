[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "borealis"
version = "0.1.0"
description = "Sector-relative multifactor equity ranking engine"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pyarrow>=12.0",
    "scipy>=1.10",  # required by pandas>=2 for spearman/kendall correlations used in the lab
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
